[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dbnsuite"
version = "0.1.0"
description = "Read a DbnSync archive of Databento files, and DbnTape tapes, from Python. Contributed and largely untested."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SquidEyes" }]
keywords = ["databento", "dbn", "market-data", "futures", "cme", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "boto3>=1.34",
    "numpy>=1.26",
    "xxhash>=3.4",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dbn = ["databento>=0.40"]
pandas = ["pandas>=2.1"]
test = ["pytest>=8", "pandas>=2.1"]

[project.urls]
Homepage = "https://dbnsuite.squideyes.com"
Source = "https://github.com/squideyes/DbnSuite/tree/main/Clients/python"
Issues = "https://github.com/squideyes/DbnSuite/issues?q=label%3Apython"

[tool.hatch.build.targets.wheel]
packages = ["src/dbnsuite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
