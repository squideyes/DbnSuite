name: release

# Push a tag such as v1.0.0 to publish DbnClient and DbnFetch to nuget.org
# and attach native dbnf binaries to a GitHub release. It signs in to nuget.org
# with Trusted Publishing, so no API key is stored: it needs a policy on nuget.org
# for this repo and release.yml, and the NUGET_USER secret, the nuget.org user name.

on:
  push:
    tags: ['v*']

# Read-only by default; the publish job asks for what it needs.
permissions:
  contents: read

env:
  # Not VERSION: MSBuild would read that as the Version property, and restore fails on the v.
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  # A Native AOT binary builds only on its own operating system, so each
  # platform's DbnFetch package is packed on a runner of that system.
  native:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Pack DbnFetch for ${{ matrix.rid }}
        shell: bash
        run: dotnet pack Core/DbnFetch -c Release -r ${{ matrix.rid }} -p:Version=${RELEASE_TAG#v} -o packages

      - name: Publish the dbnf binary
        shell: bash
        run: |
          dotnet publish Core/DbnFetch -c Release -r ${{ matrix.rid }} -p:Version=${RELEASE_TAG#v} -o bin/${{ matrix.rid }}
          cp NOTICE.md LICENSE bin/${{ matrix.rid }}/
          cd bin/${{ matrix.rid }}
          7z a ../../dbnf-${{ matrix.rid }}.zip dbnf* NOTICE.md LICENSE > /dev/null || zip ../../dbnf-${{ matrix.rid }}.zip dbnf* NOTICE.md LICENSE

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: |
            packages/*.nupkg
            dbnf-${{ matrix.rid }}.zip

  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A version on nuget.org can never be replaced, so only a commit that is on main, and so
      # passed main's checks, may be published: a tag pushed on any other commit stops here.
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$RELEASE_TAG is not on main, so it is not published."; exit 1; }

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet test DbnSuite.slnx -c Release

      # The pointer package that lists the platform packages, a portable
      # fallback for any other platform, and the library.
      - name: Pack the rest
        run: |
          V=${RELEASE_TAG#v}
          dotnet pack Core/DbnFetch -c Release -p:Version=$V -o packages
          dotnet pack Core/DbnFetch -c Release -r any -p:PublishAot=false -p:Version=$V -o packages
          dotnet pack Core/DbnClient -c Release -p:Version=$V -o packages

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: native

      # A key good for an hour, swapped for this run's GitHub identity.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "native/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          dotnet nuget push "packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" native/*.zip --title "DbnSuite $RELEASE_TAG" --generate-notes
