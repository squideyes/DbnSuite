name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: the build job runs every package's build targets and all the tests, and
# has no business holding a token that can push images. Only the image job may.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The S3 tests start a RustFS container; ubuntu runners have Docker.
      - run: dotnet test DbnSuite.slnx -c Release

  image:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    # One at a time, in order, so two merges close together cannot leave latest on the older commit.
    concurrency:
      group: image-main
    steps:
      - uses: actions/checkout@v7

      # The DbnSync worker image, public on GitHub's registry. Actions from outside GitHub are
      # pinned to a commit, since a tag can be moved; Dependabot keeps the pins current.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dbnsync-worker:latest
            ghcr.io/${{ github.repository_owner }}/dbnsync-worker:${{ github.sha }}

      # The optional DbnSpool worker.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.spool
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dbnspool-worker:latest
            ghcr.io/${{ github.repository_owner }}/dbnspool-worker:${{ github.sha }}
