version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The images the Compose files name: RustFS, Seq and Caddy.
  - package-ecosystem: docker-compose
    directories:
      - /Deploy
      - /Deploy/digitalocean
    schedule:
      interval: weekly
